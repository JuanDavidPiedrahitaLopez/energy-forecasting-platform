[project]
name = "energy-forecasting-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Juan David", email = "juandalopez117@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.170.0",
    "dotenv>=0.9.9",
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
energy-forecasting-platform = "energy_forecasting_platform:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
